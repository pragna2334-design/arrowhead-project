# Single source of truth for brain + voice. Voice and text-mode simulator both read this.

lender:
  name: "Vriddhi Finance"            # fictional NBFC
  product: "pre-approved personal loan"
  rate_min_pct: 11.5                 # agent may never quote outside [min, max]
  rate_max_pct: 18.0
  max_amount_inr: 500000
  tenure_months: [12, 60]

compliance:
  callback_hours: [10, 19]           # callbacks allowed 10:00-19:00 local (start incl., end excl.)

customer_default:                    # fictional test data only
  name: "Rahul Verma"

brain:
  agent_name: "Priya"
  agent_gender: female               # female | male; drives Hindi verb forms in the prompt. Match tts voice.
  script: roman                      # roman | devanagari  (script the LLM writes Hindi in)
  # Models are pinned explicitly; we never rely on a library default.
  agent_model: "deepseek-flash"      # VERIFY: current DeepSeek name for V4.1 Flash (per Pipecat 1.12.0)
  judge_model: "deepseek-pro"        # VERIFY: model id on your key; must differ from agent_model
  temperature: 0.4
  max_output_tokens: 300
  thinking: "disabled"               # enabled | disabled. Disabled: V4 models otherwise reason first (slow TTFB)
  max_tool_rounds: 3
  prompt_version: v1                 # prompts/<version>.md; override with PROMPT_VERSION=v2

stt:
  provider: deepgram                 # deepgram | sarvam   (independent of tts.provider)
  deepgram:
    model: "nova-3-general"
    language: "multi"                # VERIFY: Hindi-English code-switching; fall back to "hi"
  sarvam:
    mode: "codemix"                  # VERIFY: transcribe | translate | verbatim | translit | codemix

tts:
  provider: sarvam                   # sarvam | deepgram | elevenlabs
  sarvam:
    model: "bulbul:v3"
    voice: "priya"                   # female. Other bulbul:v3 female: ritu, neha, pooja, simran, kavya, ishita, shreya, roopa
    language: "hi-IN"                # no Hinglish code exists; mixed text is sent as-is
  deepgram:
    voice: "aura-2-thalia-en"        # VERIFY: English-only voice, Hinglish quality will drop
  elevenlabs:
    voice_id: ""                     # fill in
    model: "eleven_flash_v2_5"       # VERIFY

voice:
  vad_start_secs: 0.2
  vad_stop_secs: 0.2
  interrupt_min_words: 2             # barge-in: words needed to interrupt the bot (0 = Pipecat VAD default)
  calls_dir: "logs/calls"            # voice transcripts + post-call CRM records
  latency_log: "logs/latency.jsonl"
  latency_target_ms: 500

sim:
  persona_count: 25                  # first N personas from sim/personas.yaml
  max_turns: 16                      # customer turns per call
  rpm: 8                             # LLM requests per minute across agent + customer
  customer_model: "deepseek-flash"   # LLM that plays the customer (VERIFY)
  customer_temperature: 0.8

score:
  judge_temperature: 0.0
  rpm: 8

paths:
  results_dir: "results"             # results/<prompt_version>/{transcripts,postcall,scores,summary.json}
