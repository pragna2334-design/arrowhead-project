[project]
name = "arrowhead-vriddhi-agent"
version = "0.1.0"
description = "Hinglish voice AI sales agent (Vriddhi Finance, fictional) plus an automated evaluator"
requires-python = ">=3.11"
dependencies = [
    # Exact pin: every import in this repo was checked against this version's source.
    "pipecat-ai[deepgram,sarvam,webrtc,runner,silero]==1.12.0",
    "openai>=2,<4",
    "pyyaml>=6",
    "python-dotenv>=1",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff==0.16.8"]  # ruff pinned: its default rule set changes between versions

[tool.setuptools]
packages = ["brain", "voice", "sim", "score", "report", "schemas", "ab"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
