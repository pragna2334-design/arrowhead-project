name: ci

on:
  push:
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install (Python 3.11, pinned deps)
        run: |
          uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python -e ".[dev]"
      - name: Ruff
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
      - name: Pytest (offline; no API keys)
        run: .venv/bin/python -m pytest -q
      - name: Demo report builds without keys
        run: make demo-report
