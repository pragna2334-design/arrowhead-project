# Scenario pack: offer an existing cardholder an upgrade to a premium credit card (fictional bank).
# All figures here are the ONLY numbers the agent may state (prompt v3 + grounding rule).
# Compliance wording is illustrative (RBI-cards-style), not legal advice.
schema_version: 1
id: credit_card_upgrade
title: "Premium credit card upgrade"
segment: cards
company: "Udaan Bank"
company_kind: "a bank"
customer_name: "Arjun Malhotra"

product:
  name: "upgrade to the Udaan Signature premium credit card"
  pitch: "An optional upgrade from the customer's current Udaan credit card to the Udaan Signature card, with higher reward points and complimentary airport lounge access. The upgrade happens only with the customer's explicit consent, and fees, finance charges and card terms apply."
  # Finance charges (APR) on unpaid balances, not a reward or fee figure.
  rate_band: {min_pct: 36.0, max_pct: 42.0}
  amount_max_inr: null
  tenure_months: null
  fees:
    - {id: joining_fee, label: "joining fee (plus GST)", kind: inr, value: 2999}
    - {id: annual_fee, label: "annual fee from the second year (plus GST)", kind: inr, value: 4999}
  figures:
    - {id: reward_rate, label: "reward rate on eligible spends (as reward-point value)", value: 2.0, unit: pct}
    - {id: lounge_visits, label: "complimentary domestic lounge visits per year", value: 8, unit: count}
    - {id: fee_waiver_spend, label: "yearly spend for the annual fee waiver", value: 400000, unit: inr}
    - {id: forex_markup, label: "foreign currency markup", value: 2.0, unit: pct}
  emi_enabled: false

compliance:
  callback_hours: [10, 19]
  disclosure_terms: ["AI", "Udaan"]
  # Regexes matched (case-insensitive, negation-aware) against agent turns by
  # score/scenario_rules.py.
  forbidden_claims:
    - "lifetime free"
    - "(no|zero) (annual|joining|renewal) fees?"
    - "(annual|joining) fee (bilkul |koi )?(nahi|nahin) (lagegi|lagti|lagega|hai|hogi)"
    - "upgrade (is |bilkul )?(totally |completely )?free( of cost)?\\b"
    - "no hidden (charges?|fees?|costs?)"
    - "(koi )?hidden charges? (bilkul )?(nahi|nahin)"
    - "limit (increase )?(is |will be )?(guaranteed|pakka|confirmed)"
    - "(guaranteed|pakka) (credit )?limit"
    - "no (impact|effect) on (your )?(credit|cibil) score"
    - "(credit|cibil) score (par|pe) (koi )?(asar|farak|fark|impact) (nahi|nahin)"
    - "interest[- ]free forever"
    - "(always|hamesha) interest[- ]free"
    - "(has been|already|automatically) upgraded"
    - "upgrade (ho gaya|ho chuka|kar diya)"
  extra_rules:
    - "Upgrade only with the customer's explicit consent on this call; never say or imply the card is already upgraded or will be upgraded automatically."
    - "Before asking for consent, state the joining fee, the annual fee and the yearly spend needed for the fee waiver; never describe the card as free."
    - "Mention that finance charges apply on unpaid balances; never call the card interest-free beyond its stated terms."
    - "The customer can decline and keep their current card unchanged; accept a no politely and do not ask again."
    - "Never promise a credit limit increase or any effect on the customer's credit score."
    - "Do not encourage extra spending or borrowing just to reach the fee-waiver threshold."

objections:
  - id: annual_fee_high
    cues: ["annual fee zyada", "fee zyada", "fee bahut", "itni fee", "fee kyun", "fee is high", "fee is too high", "too expensive", "mehenga", "mehnga", "costly", "expensive", "fee nahi dena", "fees nahi", "फीस ज़्यादा", "महंगा"]
    guidance: "Acknowledge; state the fee and the spend-based waiver from get_product_terms honestly; compare only with stated benefits; never call it free or offer an unofficial waiver."
  - id: already_have_card
    cues: ["already card", "already have a card", "pehle se card", "card hai mere paas", "card already hai", "existing card", "another card", "dusra card", "doosra card", "current card theek", "current card is fine", "पहले से कार्ड"]
    guidance: "Acknowledge; this is an upgrade of their existing Udaan card, not an extra card; they can keep the current card unchanged if they prefer."
  - id: debt_concern
    cues: ["debt", "karz", "karza", "karja", "udhaar", "bill nahi bhar", "kharcha badh", "zyada kharch", "overspend", "credit score", "cibil", "emi pe emi", "dues", "कर्ज़", "कर्ज"]
    guidance: "Respect the concern; do not push; mention that finance charges apply on unpaid balances; suggest keeping the current card if spending is a worry."
  - id: call_later
    cues: ["baad mein", "busy", "abhi nahi", "call later", "kal call", "meeting mein"]
    guidance: "Ask for a day and time, book_callback, then end_call(reason=\"callback_booked\")."
  - id: not_interested
    cues: ["interest nahi", "nahi chahiye", "not interested", "zaroorat nahi", "upgrade nahi", "don't want to upgrade"]
    guidance: "Accept politely; confirm their current card stays as it is; then end_call(reason=\"declined\")."
  - id: number_source
    cues: ["number kahan se", "number kaise mila", "how did you get my number"]
    guidance: "Be honest and brief: they are an existing Udaan cardholder and this is an optional offer; offer to remove them from offer calls (mark_do_not_call)."

opening: "Namaste, main {agent_name} {verb}, {company} ki taraf se AI assistant, aapke credit card ke ek upgrade offer ke baare mein. Kya meri baat {customer_name} ji se ho rahi hai?"
