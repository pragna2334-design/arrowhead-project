# Scenario pack: outbound pitch for a pre-approved personal loan (fictional NBFC).
# All figures here are the ONLY numbers the agent may state (prompt v3 + grounding rule).
# Personas for the simulator live next to this file in personas.yaml.
schema_version: 1
id: personal_loan
title: "Pre-approved personal loan"
segment: lending
company: "Vriddhi Finance"
company_kind: "an NBFC"
customer_name: "Rahul Verma"

product:
  name: "pre-approved personal loan"
  pitch: "A pre-approved personal loan with quick digital processing, subject to final verification and documents."
  rate_band: {min_pct: 11.5, max_pct: 18.0}
  amount_max_inr: 500000
  tenure_months: [12, 60]
  fees:
    - {id: processing_fee, label: "processing fee", kind: pct, value: 2.0}
  figures: []
  emi_enabled: true

compliance:
  callback_hours: [10, 19]
  disclosure_terms: ["AI", "Vriddhi"]
  # Regexes matched (case-insensitive, negation-aware) against agent turns by
  # score/scenario_rules.py. Approval guarantees are already covered by the core
  # no_guaranteed_approval rule, so these only catch loan-specific misstatements.
  forbidden_claims:
    - "(no|zero) processing fee"
    - "processing fee (bilkul |koi )?(nahi|nahin) (lagti|lagegi|lagega|hai|hogi)"
    - "processing fee (bilkul )?(free|maaf|waived)"
    - "no (documents?|paperwork|kyc) (required|needed|chahiye)"
    - "(no|without|bina) (credit|cibil) check"
    - "(same[- ]day|instant|turant) disbursal (guaranteed|pakka|confirmed)"
  extra_rules:
    - "The final rate, amount and approval depend on verification and documents; say so whenever you mention the offer."
    - "Mention the processing fee whenever you discuss the cost of the loan; never call the loan free of charges."
    - "Never pressure the customer to take more than they need or suggest borrowing to repay other debt without an executive's review."

objections:
  - id: rate_too_high
    cues: ["rate zyada", "rate bahut", "interest zyada", "byaj zyada", "mehenga", "costly", "rate is high", "bank ne kam", "kam rate", "lower rate"]
    guidance: "Acknowledge; the range starts at the lowest band rate and depends on profile; offer an executive call to check their exact rate. Never match or promise a lower rate."
  - id: call_later
    cues: ["baad mein", "busy", "abhi nahi", "call later", "kal call", "meeting mein"]
    guidance: "Ask for a day and time, book_callback, then end_call(reason=\"callback_booked\")."
  - id: not_interested
    cues: ["interest nahi", "nahi chahiye", "not interested", "zaroorat nahi"]
    guidance: "Accept politely; at most one gentle question; then end_call(reason=\"declined\")."
  - id: already_has_loan
    cues: ["already loan", "pehle se loan", "loan chal raha", "existing loan"]
    guidance: "Acknowledge; they can compare or consolidate later; no pressure."
  - id: number_source
    cues: ["number kahan se", "number kaise mila", "how did you get my number"]
    guidance: "Be honest and brief: the number is in the company's outreach list for people who may be eligible; offer to remove them (mark_do_not_call)."

opening: "Namaste, main {agent_name} {verb}, {company} ki taraf se AI assistant. Kya meri baat {customer_name} ji se ho rahi hai?"
